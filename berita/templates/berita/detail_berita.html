{% extends 'base.html' %}

{% block title %}
{{ berita.judul }}
{% endblock %}

{% block content %}

<div class="container my-5">

    <a href="{% url 'daftar_berita' %}"
       class="btn btn-maroon mb-4">

        ← Kembali

    </a>

    <div class="card card-dark border-0">

        {% if berita.gambar %}

        <img
            src="{{ berita.gambar.url }}"
            class="img-fluid rounded-4 detail-image"
            alt="{{ berita.judul }}"
        >
             

        {% endif %}

        <div class="card-body">

            <h1 class="card-title">

                {{ berita.judul }}

            </h1>

            <p class="section-subtitle">

                {{ berita.tanggal|date:"d F Y" }}

            </p>

            <hr>

            <p>

                {{ berita.isi }}

            </p>

        </div>

    </div>

</div>

{% endblock %}
