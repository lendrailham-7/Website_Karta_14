{% extends 'base.html' %}

{% block title %}
Galeri
{% endblock %}

{% block content %}

<div class="container my-5">

    <div class="text-center mb-5">

        <h1 class="fw-bold">

            Galeri Kegiatan

        </h1>

        <p class="text-muted">

            Dokumentasi kegiatan Karang Taruna

        </p>

    </div>

    <div class="row g-4">

        {% for item in galeri %}

        <div class="col-md-4">

            <div class="card shadow-sm">

                <a href="{% url 'detail_galeri' item.id %}">

                    <img src="{{ item.gambar.url }}"
                         class="card-img-top"
                         style="
                            height:250px;
                            object-fit:cover;
                         ">
                
                </a>

                <div class="card-body">

                    <h5>

                        {{ item.judul }}

                    </h5>

                    <p>

                        {{ item.deskripsi }}

                    </p>
                    <a href="{% url 'detail_galeri' item.id %}"
                       class="btn btn-success w-100">
                                    
                        Lihat Foto
                                    
                    </a>

                </div>

            </div>

        </div>

        {% empty %}

        <div class="col-12">

            <div class="alert alert-warning text-center">

                Belum ada foto.

            </div>

        </div>

        {% endfor %}

    </div>

</div>

{% endblock %}
